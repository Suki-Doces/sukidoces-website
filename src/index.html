<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Suki Doces</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

</head>
<body>
  <app-root></app-root>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  <script>
        // Altera o título quando o usuário tenta sair da página
        window.onblur = function() {
          document.title = "Volte aqui! Estamos te esperando!";
        };
        // Restaura o título original quando o usuário volta para a página
        window.onfocus = function() {
          document.title = "Loja Suki Doces";
        };
    </script>
</body>
</html>
