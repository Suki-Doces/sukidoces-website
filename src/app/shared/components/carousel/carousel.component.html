<div class="carousel-container" *ngIf="isLoading">
  <div class="carousel-wrapper">
    <div class="flex-align-center carousel-slide skeleton-slide">
      <div class="carousel-item skeleton-item active">
        <div class="loader-circle"></div>
      </div>
    </div>
  </div>
</div>

<div class="carousel-container carousel-fade-in" *ngIf="products.length > 0 && !isLoading">
  <div class="carousel-wrapper">
    <div class="flex-align-center carousel-slide" [style.transform]="'translateX(' + offset + '%)'">

      <a *ngFor="let prod of products; let i = index" [routerLink]="['/produtos', prod.id_produto]"
        class="flex-center carousel-item" [class.active]="i === currentIndex">

        <!-- Imagem de fundo desfocada -->
        <img [ngSrc]="getProductImage(prod.imagem)" class="bg-blur" width="800" height="400" aria-hidden="true" priority>

        <!-- Imagem principal do produto -->
        <img [ngSrc]="getProductImage(prod.imagem)" [alt]="'Comprar ' + prod.nome" class="main-img"  width="800" height="400" priority
          (error)="onImageError($event)">

        <div class="carousel-overlay">
          <div class="flex-col overlay-content">
            <span class="badge" *ngIf="i === 0">#1 Mais Vendido</span>
            <span class="badge" *ngIf="i !== 0">Destaque</span>

            <h1 class="product-title">{{ prod.nome }}</h1>
            <p class="product-price">{{ prod.preco | currency:'BRL':'symbol':'1.2-2' }}</p>

            <span class="btn btn-glass btn-buy">Comprar</span>
          </div>
        </div>

      </a>

    </div>

    <button id="prevBtn" class="nav-btn" (click)="prevSlide()" aria-label="Slide anterior">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="m15 19-6-7 1.5-1.75M15 5l-2 2.333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button id="nextBtn" class="nav-btn" (click)="nextSlide()" aria-label="Próximo slide">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="m9 5 2 2.333M9 19l6-7-1.5-1.75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <div class="indicators-wrapper">
      <button *ngFor="let prod of products; let i = index" class="indicator" [class.active]="i === currentIndex"
        (click)="goToSlide(i); resetInterval()" [attr.aria-label]="'Ir para o banner ' + (i + 1)">
      </button>
    </div>
  </div>
</div>
