<main class="detail-container animate-fade">
    <button routerLink="/produtos" class="btn btn-glass btn-secondary back-link" aria-label="Voltar para o catálogo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_iconCarrier">
                <path d="M4.5 12L9.5 7M4.5 12L9.5 17M4.5 12L11 12M14.5 12C16.1667 12 19.5 13 19.5 17"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            </g>
        </svg>
            Voltar para o catálogo
    </button>

    <div *ngIf="isLoading" style="padding: 40px; justify-self: center;">
        <div class="loader-circle"></div>
    </div>

    <div class="glass-container product-detail-wrapper animate-fade" *ngIf="!isLoading && product">
        <div class="flex-center detail-image">
            <img class="img-blur-bg" [src]="getProductImage(product.imagem)" aria-hidden="true" fetchpriority="high">

            <img class="img-main" [src]="getProductImage(product.imagem)" [alt]="'Imagem de ' + product.nome">
        </div>

        <div class="flex-col detail-info">
            <h1>{{ product.nome }}</h1>

            <div class="detail-price">
                {{ product.preco | currency:'BRL':'symbol':'1.2-2' }}
            </div>

            <div class="detail-description">
                <h3>Sobre este doce:</h3>
                <p style="white-space: pre-wrap;">{{ product.descricao }}</p>
            </div>

            <div class="purchase-actions">

                <div class="quantity-selector">
                    <button type="button" class="qty-btn" (click)="decrement()" [disabled]="quantity <= 1">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
                        </svg>
                    </button>

                    <input type="number" class="qty-value-input" [value]="quantity" (input)="onQuantityChange($event)"
                        min="1" [max]="product.quantidade">

                    <button type="button" class="qty-btn" (click)="increment()"
                        [disabled]="quantity >= product.quantidade">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                </div>

                <button type="button" class="btn btn-glass btn-primary btn-add-cart" (click)="addToCart()"
                    [disabled]="product.quantidade === 0">
                    <h3>
                        Adicionar ao Carrinho
                    </h3>
                </button>
            </div>

            <div class="stock-info">
                <ng-container *ngIf="product.quantidade > 0; else outOfStock">
                    <strong class="in-stock">Disponível em estoque ({{ product.quantidade }} un.)</strong>
                </ng-container>
                <ng-template #outOfStock>
                    <strong class="out-stock">Indisponível no momento</strong>
                </ng-template>
            </div>
        </div>
    </div>
</main>
