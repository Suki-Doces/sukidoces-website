<div class="admin-body">
  
  <aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
      <a class="header-logo">
        <img src="assets/images/icons/sukidoces-logo-adm.svg" alt="Suki Doces Logo">
      </a>
      <button class="toggler sidebar-toggler" (click)="toggleSidebar()">
        <span class="material-symbols-rounded">chevron_left</span>
      </button>
      <button class="toggler menu-toggler" (click)="toggleSidebar()">
        <span class="material-symbols-rounded">menu</span>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list primary-nav">
        
        <li class="nav-item">
          <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
            <span class="nav-icon material-symbols-rounded">monitoring</span>
            <span class="nav-label">Dashboard</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="/admin/pedidos" routerLinkActive="active" class="nav-link">
            <span class="nav-icon material-symbols-rounded">receipt_long</span>
            <span class="nav-label">Pedidos</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="/admin/produtos" routerLinkActive="active" class="nav-link">
            <span class="nav-icon material-symbols-rounded">analytics</span>
            <span class="nav-label">Produtos</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="/admin/estoque" routerLinkActive="active" class="nav-link">
            <span class="nav-icon material-symbols-rounded">inventory_2</span>
            <span class="nav-label">Estoque</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="/admin/clientes" routerLinkActive="active" class="nav-link">
            <span class="nav-icon material-symbols-rounded">group</span>
            <span class="nav-label">Clientes</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="notificacoes" routerLinkActive="active" class="nav-link">
            <span class="nav-icon material-symbols-rounded">notifications</span>
            <span class="nav-label">Notificações</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="contatos" routerLinkActive="active" class="nav-link">
            <span class="nav-icon material-symbols-rounded">chat</span>
            <span class="nav-label">Contatos</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="/admin/configuracoes" routerLinkActive="active" class="nav-link">
            <span class="nav-icon material-symbols-rounded">settings</span>
            <span class="nav-label">Configurações</span>
          </a>
        </li>
        
      </ul>

      <ul class="nav-list secondary-nav">
        <li class="nav-item">
          <a (click)="logout()" class="nav-link" style="cursor: pointer;">
            <span class="nav-icon material-symbols-rounded">logout</span>
            <span class="nav-label">Sair</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">

    <!-- NOVO: Barra superior com foto do admin -->
    <!-- Aparece automaticamente em TODAS as páginas do painel -->
    <header class="admin-topbar">
      <div class="topbar-right">

        <!-- Nome do admin — some quando o menu está recolhido em mobile -->
        <span class="admin-nome">{{ nomeAdmin }}</span>

        <!-- Foto circular — se não tiver foto salva, usa o ícone padrão -->
        <a routerLink="/admin/configuracoes" class="avatar-link" title="Ir para Configurações">
          <img
            [src]="fotoAdminUrl || 'assets/images/icons/User - Icon.svg'"
            alt="Foto do Administrador"
            class="avatar-admin"
          />
        </a>

      </div>
    </header>
    <!-- FIM da barra superior -->

    <router-outlet></router-outlet>

  </main>
</div>
