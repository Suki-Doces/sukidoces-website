<div class="admin-body">

  @if (!isCollapsed) {
    <div class="sidebar-backdrop" (click)="toggleSidebar()" aria-hidden="true"></div>
  }

  <aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-name">Suki</span>
        <span class="brand-tagline">doces</span>
        <span class="brand-area">Administração</span>
      </div>
      <button
        type="button"
        class="toggler"
        (click)="toggleSidebar()"
        [attr.aria-label]="isCollapsed ? 'Expandir menu' : 'Recolher menu'"
      >
        <app-admin-icon name="chevron-left" />
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Menu administrativo">
      <ul class="nav-list primary-nav">

        <li class="nav-item">
          <a routerLink="/admin/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link"
             [attr.title]="isCollapsed ? 'Painel' : null" (click)="onNavigate()">
            <app-admin-icon class="nav-icon" name="monitoring" />
            <span class="nav-label">Painel</span>
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/admin/pedidos" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link"
             [attr.title]="isCollapsed ? 'Pedidos' : null" (click)="onNavigate()">
            <app-admin-icon class="nav-icon" name="package" />
            <span class="nav-label">Pedidos</span>
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/admin/produtos" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link"
             [attr.title]="isCollapsed ? 'Adicionar Produto' : null" (click)="onNavigate()">
            <app-admin-icon class="nav-icon" name="circle-plus" />
            <span class="nav-label">Adicionar Produto</span>
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/admin/estoque" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link"
             [attr.title]="isCollapsed ? 'Estoque' : null" (click)="onNavigate()">
            <app-admin-icon class="nav-icon" name="boxes" />
            <span class="nav-label">Estoque</span>
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/admin/clientes" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link"
             [attr.title]="isCollapsed ? 'Clientes' : null" (click)="onNavigate()">
            <app-admin-icon class="nav-icon" name="users" />
            <span class="nav-label">Clientes</span>
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="notificacoes" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link"
             [attr.title]="isCollapsed ? 'Notificações' : null" (click)="onNavigate()">
            <app-admin-icon class="nav-icon" name="bell" />
            <span class="nav-label">Notificações</span>
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="contatos" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link"
             [attr.title]="isCollapsed ? 'Contatos' : null" (click)="onNavigate()">
            <app-admin-icon class="nav-icon" name="mail" />
            <span class="nav-label">Contatos</span>
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/admin/configuracoes" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link"
             [attr.title]="isCollapsed ? 'Configurações' : null" (click)="onNavigate()">
            <app-admin-icon class="nav-icon" name="settings" />
            <span class="nav-label">Configurações</span>
          </a>
        </li>

      </ul>

      <ul class="nav-list secondary-nav">
        <li class="nav-item">
          <button type="button" class="nav-link nav-link--logout" (click)="logout()"
                  [attr.title]="isCollapsed ? 'Sair' : null">
            <app-admin-icon class="nav-icon" name="log-out" />
            <span class="nav-label">Sair</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">

    <div class="topbar-right">
      <span class="admin-nome">{{ nomeAdmin }}</span>
      <a routerLink="/admin/configuracoes" class="avatar-link" title="Ir para Configurações">
        <img
          [src]="fotoAdminUrl || 'assets/images/icons/User - Icon.svg'"
          alt="Foto do Administrador"
          class="avatar-admin"
        />
      </a>
    </div>

    <router-outlet></router-outlet>

  </main>
</div>
